<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyInstants Button</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #121212;
            font-family: Arial, sans-serif;
        }

        .button {
            padding: 20px 40px;
            font-size: 28px;
            font-weight: bold;
            color: white;
            background: #ff5722;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .button:hover {
            transform: scale(1.05);
            background: #ff7043;
        }

        .button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <button class="button" onclick="openMyInstants()">
        🔊 MyInstants öffnen
    </button>

    <script>
        function openMyInstants() {
            window.open(
                "https://www.myinstants.com/de/index/de/",
                "_blank"
            );
        }
    </script>

</body>
</html>
